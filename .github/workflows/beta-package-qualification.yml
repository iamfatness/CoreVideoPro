name: Beta package qualification

on:
  workflow_dispatch:
    inputs:
      releaseTag:
        description: Existing draft beta release containing the immutable assets
        required: true
        type: string
      expectedCommit:
        description: Full main commit SHA used to build the assets
        required: true
        type: string

permissions:
  contents: read

jobs:
  installed-windows-beta:
    runs-on: windows-latest
    timeout-minutes: 20
    # GitHub hides draft releases from read-only installation tokens. Keep the
    # token scoped to the metadata/download step, not the installer process.
    permissions:
      contents: write
    env:
      BETA_TAG: ${{ inputs.releaseTag }}
      BETA_COMMIT: ${{ inputs.expectedCommit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expectedCommit }}
          persist-credentials: false
      - name: Verify immutable release identity and asset hashes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:BETA_TAG -notmatch '^beta-[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-f0-9]{7}$' -or
              $env:BETA_COMMIT -notmatch '^[a-f0-9]{40}$') { throw 'Invalid beta identity.' }
          if ((git rev-parse HEAD).Trim() -ne $env:BETA_COMMIT) { throw 'Checkout identity mismatch.' }
          $release = gh release view $env:BETA_TAG --repo $env:GITHUB_REPOSITORY --json tagName,targetCommitish,isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.targetCommitish -ne $env:BETA_COMMIT -or
              -not $release.isDraft) { throw 'Expected an exact-commit draft release.' }
          $tagCommit = gh api "repos/$env:GITHUB_REPOSITORY/commits/$env:BETA_TAG" --jq .sha
          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $env:BETA_COMMIT) { throw 'Tag target mismatch.' }
          New-Item -ItemType Directory artifacts/beta-package -Force | Out-Null
          gh release download $env:BETA_TAG --repo $env:GITHUB_REPOSITORY --dir artifacts/beta-package
          if ($LASTEXITCODE -ne 0) { throw 'Asset download failed.' }
          $archive = "artifacts/beta-package/CoreVideoPro-win-x64-$env:BETA_TAG.zip"
          $installer = "artifacts/beta-package/CoreVideoPro-Setup-$env:BETA_TAG.exe"
          foreach ($asset in @($archive, $installer)) {
            $expected = ((Get-Content -LiteralPath ($asset + '.sha256') -Raw).Trim() -split '\s+')[0]
            if ((Get-FileHash -LiteralPath $asset).Hash -ne $expected) { throw "Hash mismatch: $asset" }
          }
          $manifest = Get-Content artifacts/beta-package/build-manifest.json -Raw | ConvertFrom-Json
          $setup = Get-Content ($installer + '.manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.sourceCommit -ne $env:BETA_COMMIT -or $manifest.releaseId -ne $env:BETA_TAG -or
              $manifest.framePerformanceAccepted -ne $false -or
              $setup.applicationCommit -ne $env:BETA_COMMIT -or $setup.packagingCommit -ne $env:BETA_COMMIT -or
              $setup.archiveSha256 -ne (Get-FileHash $archive).Hash -or
              $setup.installerSha256 -ne (Get-FileHash $installer).Hash) { throw 'Asset provenance mismatch.' }
      - name: Verify packaged payload
        shell: pwsh
        run: |
          $archive = "artifacts/beta-package/CoreVideoPro-win-x64-$env:BETA_TAG.zip"
          & scripts/alpha/Test-AlphaPackage.ps1 -Archive $archive
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $archive))
          try {
            $node = $zip.GetEntry('CoreVideoPro-Beta/node/node.exe')
            if (-not $node) { throw 'Archive entry CoreVideoPro-Beta/node/node.exe not found; entry names must use forward slashes (#1047).' }
            [IO.Compression.ZipFileExtensions]::ExtractToFile($node, (Join-Path $PWD 'artifacts/beta-package/node.exe'))
          } finally { $zip.Dispose() }
          & scripts/alpha/Test-AlphaNodePackaging.ps1 -NodeExe artifacts/beta-package/node.exe
      - name: Prepare and verify silent-install prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $principal = [Security.Principal.WindowsPrincipal]::new([Security.Principal.WindowsIdentity]::GetCurrent())
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw 'Silent camera setup requires an elevated clean runner.'
          }
          $installer = "artifacts/beta-package/CoreVideoPro-Setup-$env:BETA_TAG.exe"
          $setup = Get-Content ($installer + '.manifest.json') -Raw | ConvertFrom-Json
          $manifest = Get-Content artifacts/beta-package/build-manifest.json -Raw | ConvertFrom-Json
          $destination = Join-Path $PWD 'artifacts/beta-prerequisites'
          New-Item -ItemType Directory $destination -Force | Out-Null
          # Use the exact Microsoft-signed prerequisite embedded in this asset.
          & 7z x $installer "-o$destination" '*vc_redist.x64.exe' -r -y
          if ($LASTEXITCODE -ne 0) { throw 'Cannot extract bundled VC runtime.' }
          $redist = @(Get-ChildItem $destination -Recurse -File -Filter vc_redist.x64.exe)
          if ($redist.Count -ne 1) { throw 'Expected exactly one embedded VC runtime.' }
          if ((Get-FileHash $redist[0].FullName).Hash -ne $setup.vcRedistSha256) { throw 'Embedded runtime hash mismatch.' }
          $signature = Get-AuthenticodeSignature $redist[0].FullName
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch '(^|, )O=Microsoft Corporation(,|$)') {
            throw 'Bundled VC runtime has no valid Microsoft signature.'
          }
          $log = Join-Path $destination 'vc-runtime.log'
          $process = Start-Process $redist[0].FullName -ArgumentList @('/install','/quiet','/norestart','/log', ('"' + $log + '"')) -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -notin @(0,3010,1638)) { throw "VC runtime preparation failed: $($process.ExitCode)" }
          $runtime = Get-ItemProperty 'HKLM:/SOFTWARE/Microsoft/VisualStudio/14.0/VC/Runtimes/x64'
          $runtime | ConvertTo-Json | Set-Content (Join-Path $destination 'runtime.json')
          if ($runtime.Installed -ne 1 -or [version]($runtime.Version.TrimStart('v')) -lt [version]$manifest.vcRuntimeVersion) {
            throw 'Required VC runtime is not installed; installer safety tests would be inconclusive.'
          }
          & "$env:WINDIR/SysWOW64/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -ExecutionPolicy Bypass -File scripts/alpha/Test-VirtualCameraOwnership.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Camera ownership/hash checks failed in the installer host.' }
      - name: Install, probe and uninstall on the clean runner
        shell: pwsh
        run: |
          & scripts/alpha/Test-AlphaInstaller.ps1 -Installer "artifacts/beta-package/CoreVideoPro-Setup-$env:BETA_TAG.exe"
      - name: Retain failed camera setup diagnostics
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $PWD 'artifacts/camera-setup-diagnostics'
          New-Item -ItemType Directory $work -Force | Out-Null
          $installerLogs = Join-Path $env:LOCALAPPDATA 'CoreVideoPro/installer-logs'
          if (Test-Path $installerLogs) { Copy-Item $installerLogs (Join-Path $work 'installer-logs') -Recurse }
          Expand-Archive "artifacts/beta-package/CoreVideoPro-win-x64-$env:BETA_TAG.zip" (Join-Path $work 'payload')
          $app = Join-Path $work 'payload/CoreVideoPro-Beta'
          # NSIS is 32-bit: reproduce its actual PowerShell host on the disposable
          # runner and retain stdout/stderr that the rolled-back UI cannot show.
          $hostPath = Join-Path $env:WINDIR 'SysWOW64/WindowsPowerShell/v1.0/powershell.exe'
          foreach ($action in @('Inspect','Install','Uninstall')) {
            $arguments = '-NoProfile -ExecutionPolicy Bypass -File "' + (Join-Path $app 'Install-VirtualCamera.ps1') + '" -Action ' + $action + ' -AppDirectory "' + $app + '"'
            $process = Start-Process $hostPath -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput (Join-Path $work "$action.stdout.txt") -RedirectStandardError (Join-Path $work "$action.stderr.txt")
            Write-Output "$action exit: $($process.ExitCode)"
            Get-Content (Join-Path $work "$action.stderr.txt")
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beta-installed-qualification
          path: |
            artifacts/installer-validation/
            artifacts/beta-prerequisites/*.log
            artifacts/beta-prerequisites/*.json
            artifacts/camera-setup-diagnostics/*.txt
            artifacts/camera-setup-diagnostics/installer-logs/**
            artifacts/beta-package/*.json
            artifacts/beta-package/*.sha256
          retention-days: 14

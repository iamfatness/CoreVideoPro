name: Deploy Demo

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "index.html"
      - "vite.config.ts"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - "site-worker.js"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-demo.yml"
  workflow_dispatch:

concurrency:
  group: deploy-demo
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy CoreVideo Pro demo
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      VITE_DEMO_BASE: "/pro/demo/"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Validate Cloudflare configuration
        id: cloudflare_config
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            {
              echo "Cloudflare deploy skipped."
              echo
              echo "Set CLOUDFLARE_API_TOKEN as a repository secret and"
              echo "CLOUDFLARE_ACCOUNT_ID as either a repository secret or variable"
              echo "to enable deployment of the CoreVideo Pro demo."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "deploy_enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deploy_enabled=true" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Build demo (mock-engine SPA)
        run: npm run build

      - name: Deploy to Cloudflare Workers
        if: steps.cloudflare_config.outputs.deploy_enabled == 'true'
        run: npx wrangler@latest deploy

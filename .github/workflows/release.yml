name: Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Packaging platform (win, mac, or all)
        required: false
        default: all
        type: choice
        options:
          - all
          - win
          - mac
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pack-windows:
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == 'win'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install packaging deps
        run: npm install --no-save electron@latest electron-builder@latest
      - name: Download Electron binary
        run: node node_modules/electron/install.js
      - name: Package Windows installer
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          COREVIDEO_PACK_TARGET: --win
        run: npm run pack:desktop
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: corevideo-desktop-win
          path: artifacts/desktop/*
          if-no-files-found: error

  pack-macos:
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == 'mac'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install packaging deps
        run: npm install --no-save electron@latest electron-builder@latest
      - name: Download Electron binary
        run: node node_modules/electron/install.js
      - name: Package macOS disk image
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          COREVIDEO_PACK_TARGET: --mac
        run: npm run pack:desktop
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: corevideo-desktop-mac
          path: artifacts/desktop/*
          if-no-files-found: error
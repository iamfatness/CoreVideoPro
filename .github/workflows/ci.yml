name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:desktop

  test-unit:
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  test-integration:
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  test-native-core:
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:native-core

  native-stub:
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++
      - name: Configure stub build
        run: cmake -S native -B native/build -DCOREVIDEO_STUB=ON -G Ninja
      - name: Build
        run: cmake --build native/build
      - name: Contract parity (protocol drift gate)
        run: ./native/build/corevideo-native-tests --gtest_filter=ContractParity.*
      - name: Native stub tests
        run: ctest --test-dir native/build --output-on-failure

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install headless display deps
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: npm ci
      - name: Install Electron e2e deps
        run: npm install --no-save electron@latest tsx esbuild
      - name: Download Electron binary
        run: node node_modules/electron/install.js
      - name: Playwright Electron smoke
        run: xvfb-run --auto-servernum npm run test:e2e